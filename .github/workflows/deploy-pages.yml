name: Deploy product to GitHub Pages

# Publishes the product as a live URL the instructor and pilot participants can open
# without cloning anything.
#
# The Phase 2 product is the game, so game/ becomes the site root. The Phase 1 analysis
# tool is staged at /phase1/ beside it: the Phase 2 report has to argue that the product
# follows from the Phase 1 analysis, and a reader can then open the tool that produced it
# in one click. Staging copies files verbatim into a build directory rather than moving
# anything in the repository, so both products keep their own relative paths and neither
# the frozen Phase 1 tag nor the analysis pipeline is disturbed.
#
# Deployment is a Phase 2 requirement ("Executed checks and deployment"), so this must
# actually run at least once before the Phase 2 deadline. A green workflow with no
# successful deployment step in the Actions log is not evidence.

on:
  push:
    branches: [main]
    paths:
      - "product/**"
      - "analysis/build_product_data.py"
      - "analysis/build_standalone_html.py"
      - "data/clean/analysis_dataset.csv"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; do not cancel a run that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Regenerate the reference distribution from the frozen dataset
        # Deploying a stale copy of the data would publish numbers that do not match the
        # analysis. Regenerating here makes the deployed site a product of the dataset.
        run: python analysis/build_product_data.py

      - name: Rebuild the single-file distributable
        run: python analysis/build_standalone_html.py

      - name: Verify the page logic before publishing
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: node tests/test_product_app.js

      - name: Stage the site (game at root, Phase 1 tool under /phase1/)
        run: |
          set -eu
          rm -rf site
          mkdir -p site/phase1
          cp game/index.html game/config.js game/logic.js game/profile.js \
             game/hub.js game/app.js site/
          mkdir -p site/vendor
          cp game/vendor/phaser.min.js site/vendor/
          cp product/index.html site/phase1/index.html
          cp product/reference-data.js site/phase1/reference-data.js
          # 部署产物必须是自洽的：缺任何一个文件都会让页面白屏
          for f in site/index.html site/config.js site/logic.js site/profile.js \
                   site/hub.js site/app.js site/vendor/phaser.min.js \
                   site/phase1/index.html site/phase1/reference-data.js; do
            [ -s "$f" ] || { echo "::error::missing or empty: $f"; exit 1; }
          done
          echo "staged:"; find site -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
